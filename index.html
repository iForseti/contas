<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2B34">
<title>Meus gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F0;--ink:#1B2B34;--mut:#62737C;--card:#fff;--line:#D9E1E0;--rec:#1F7A5C;--des:#B83C37;--warn:#B7791F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif;padding-bottom:104px}
.w{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:max(14px,env(safe-area-inset-top)) 0 22px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav h1{font-size:18px;margin:0;text-transform:capitalize;font-weight:600}
button{font:inherit;cursor:pointer}
.ic{background:#ffffff1f;color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:20px}
.saldo small{color:#B9C7CD;font-size:13px}
.saldo b{display:block;font-size:34px;font-weight:700;letter-spacing:-.5px}
.sub{display:flex;gap:18px;margin-top:12px;font-size:14px;color:#D7E1E5;flex-wrap:wrap}
.sub span b{color:#fff;font-weight:600}
.tabs{display:flex;gap:8px;margin:16px 0 8px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--mut);padding:7px 14px;border-radius:999px;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lista{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #A9B7BC;background:#fff;color:#fff;font-size:15px;line-height:1;padding:0}
.ck.ok{background:var(--rec);border-color:var(--rec)}
.cor{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit}
.cor strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cor small{color:var(--mut);font-size:13px}
.late{color:var(--des);font-weight:600}
.val{font-weight:700;white-space:nowrap}
.val.r{color:var(--rec)}.val.d{color:var(--des)}
.pago .cor strong,.pago .val{opacity:.5}
.vazio{padding:28px 16px;text-align:center;color:var(--mut)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:max(20px,env(safe-area-inset-bottom));background:var(--rec);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px #1b2b3440}
.cfg{position:fixed;left:max(16px,calc(50% - 304px));bottom:max(20px,env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:999px;padding:14px 18px;color:var(--mut)}
dialog{border:0;border-radius:16px;padding:20px;width:min(440px,calc(100% - 24px));color:var(--ink);font:inherit}
dialog::backdrop{background:#1b2b3499}
dialog h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font-size:15px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.lin{display:flex;gap:10px}.lin>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-size:15px}
.chk input{width:auto}
.acoes{display:flex;gap:8px;margin-top:16px}
.acoes button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600}
.acoes .pri{background:var(--rec);border-color:var(--rec);color:#fff}
.acoes .del{color:var(--des)}
.msg{font-size:13px;color:var(--mut);margin-top:10px;min-height:18px}
.nota{font-size:13px;color:var(--mut);margin:0 0 4px}
:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
</style>
</head>
<body>
<header><div class="w">
  <div class="nav">
    <button class="ic" id="ant" aria-label="Mês anterior">‹</button>
    <h1 id="mesTxt"></h1>
    <button class="ic" id="prox" aria-label="Próximo mês">›</button>
  </div>
  <div class="saldo"><small>Saldo previsto do mês</small><b id="saldo"></b></div>
  <div class="sub">
    <span>Receitas <b id="rec"></b></span>
    <span>Despesas <b id="des"></b></span>
    <span>A pagar <b id="apagar"></b></span>
  </div>
</div></header>

<main class="w">
  <div class="tabs" id="tabs">
    <button data-f="todos" class="on">Todos</button>
    <button data-f="pendentes">Pendentes</button>
    <button data-f="pagos">Pagos</button>
  </div>
  <div class="lista" id="lista"></div>
</main>

<button class="cfg" id="abrirCfg">Backup e sincronia</button>
<button class="fab" id="novo">+ Novo lançamento</button>

<dialog id="dlg">
  <h2 id="dlgTit">Novo lançamento</h2>
  <div class="seg">
    <label><input type="radio" name="tipo" value="despesa" checked>Despesa</label>
    <label><input type="radio" name="tipo" value="receita">Receita</label>
  </div>
  <label for="fDesc">Descrição</label><input id="fDesc" placeholder="Ex.: Conta de luz">
  <div class="lin">
    <div><label for="fVal">Valor (R$)</label><input id="fVal" inputmode="decimal" placeholder="0,00"></div>
    <div><label for="fVenc">Vencimento</label><input id="fVenc" type="date"></div>
  </div>
  <label for="fCat">Categoria</label>
  <input id="fCat" list="cats" placeholder="Ex.: Moradia">
  <datalist id="cats"><option>Moradia<option>Contas<option>Mercado<option>Transporte<option>Saúde<option>Educação<option>Lazer<option>Salário<option>Outros</datalist>
  <label for="fObs">Observação</label><textarea id="fObs" rows="2"></textarea>
  <div id="repWrap"><label for="fRep">Repetir por quantos meses?</label><input id="fRep" type="number" min="1" max="60" value="1"></div>
  <label class="chk"><input type="checkbox" id="fPago"><span id="fPagoTxt">Já está pago</span></label>
  <div class="msg" id="erro" style="color:var(--des)"></div>
  <div class="acoes">
    <button id="cancelar">Cancelar</button>
    <button class="del" id="excluir" hidden>Excluir</button>
    <button class="pri" id="salvar">Salvar</button>
  </div>
</dialog>

<dialog id="dlgCfg">
  <h2>Backup e sincronia</h2>
  <p class="nota">Os dados ficam salvos neste aparelho. Para usar no celular e no computador, envie para a nuvem (um Gist privado do seu GitHub) e baixe no outro aparelho.</p>
  <label for="cToken">Token do GitHub (permissão apenas "gist")</label>
  <input id="cToken" type="password" autocomplete="off">
  <label for="gist">ID do Gist (preenchido sozinho no primeiro envio)</label>
  <input id="gist" autocomplete="off">
  <div class="acoes">
    <button id="enviar">Enviar para nuvem</button>
    <button id="baixar">Baixar da nuvem</button>
  </div>
  <div class="acoes">
    <button id="exportar">Exportar arquivo</button>
    <button id="importar">Importar arquivo</button>
  </div>
  <input type="file" id="arq" accept="application/json" hidden>
  <div class="msg" id="cMsg"></div>
  <div class="acoes"><button id="fechaCfg">Fechar</button></div>
</dialog>

<script>
const K='gastos.v1', S='gastos.sync';
const $=s=>document.querySelector(s);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dm=d=>d.slice(8,10)+'/'+d.slice(5,7);
function ler(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
function gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let db=ler(K,[]), mes=hoje().slice(0,7), filtro='todos', editando=null;
const salvarDb=()=>gravar(K,db);

function mudaMes(n){const [y,m]=mes.split('-').map(Number);const d=new Date(y,m-1+n,1);mes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
const soma=a=>a.reduce((t,x)=>t+x.valor,0);

function render(){
  const [y,m]=mes.split('-').map(Number);
  $('#mesTxt').textContent=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const todos=db.filter(x=>x.venc.startsWith(mes));
  const rec=soma(todos.filter(x=>x.tipo==='receita')), des=soma(todos.filter(x=>x.tipo==='despesa'));
  $('#saldo').textContent=brl(rec-des);
  $('#rec').textContent=brl(rec); $('#des').textContent=brl(des);
  $('#apagar').textContent=brl(soma(todos.filter(x=>x.tipo==='despesa'&&!x.pago)));
  let itens=todos.filter(x=>filtro==='todos'||(filtro==='pagos'?x.pago:!x.pago)).sort((a,b)=>a.venc.localeCompare(b.venc));
  $('#lista').innerHTML=itens.length?itens.map(x=>{
    const atraso=!x.pago&&x.tipo==='despesa'&&x.venc<hoje();
    const sinal=x.tipo==='receita'?'+ ':'− ';
    return `<div class="it ${x.pago?'pago':''}">
      <button class="ck ${x.pago?'ok':''}" data-id="${x.id}" data-a="baixa" aria-label="${x.pago?'Desfazer baixa':'Dar baixa'}">${x.pago?'✓':''}</button>
      <button class="cor" data-id="${x.id}" data-a="edit"><strong>${esc(x.desc)}</strong>
      <small>${atraso?'<span class="late">Atrasado · </span>':''}${x.tipo==='receita'?'Entra':'Vence'} ${dm(x.venc)}${x.cat?' · '+esc(x.cat):''}</small></button>
      <span class="val ${x.tipo==='receita'?'r':'d'}">${sinal}${brl(x.valor)}</span></div>`}).join('')
    :'<div class="vazio">Nenhum lançamento neste filtro. Toque em “Novo lançamento” para começar.</div>';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
}

$('#ant').onclick=()=>mudaMes(-1); $('#prox').onclick=()=>mudaMes(1);
$('#tabs').onclick=e=>{const f=e.target.dataset.f;if(f){filtro=f;render()}};
$('#lista').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const x=db.find(i=>i.id===b.dataset.id);if(!x)return;
  if(b.dataset.a==='baixa'){x.pago=!x.pago;x.pagoEm=x.pago?hoje():null;salvarDb();render()}
  else abrir(x);
};

const tipoSel=()=>document.querySelector('input[name=tipo]:checked').value;
function abrir(x){
  editando=x||null;
  $('#dlgTit').textContent=x?'Editar lançamento':'Novo lançamento';
  document.querySelector(`input[name=tipo][value=${x?x.tipo:'despesa'}]`).checked=true;
  $('#fDesc').value=x?x.desc:''; $('#fVal').value=x?String(x.valor).replace('.',','):'';
  $('#fVenc').value=x?x.venc:(mes===hoje().slice(0,7)?hoje():mes+'-01');
  $('#fCat').value=x?x.cat:''; $('#fObs').value=x?x.obs:''; $('#fPago').checked=x?x.pago:false;
  $('#fRep').value=1; $('#repWrap').hidden=!!x; $('#excluir').hidden=!x; $('#erro').textContent='';
  $('#dlg').showModal();
}
$('#novo').onclick=()=>abrir(null);
$('#cancelar').onclick=()=>$('#dlg').close();
$('#excluir').onclick=()=>{if(confirm('Excluir este lançamento?')){db=db.filter(i=>i!==editando);salvarDb();$('#dlg').close();render()}};

function valorNum(t){t=t.trim();return t.includes(',')?parseFloat(t.replace(/\./g,'').replace(',','.')):parseFloat(t)}
function somaMes(data,i){
  const [y,m,d]=data.split('-').map(Number);const t=new Date(y,m-1+i,1);
  const ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(d,ult)).padStart(2,'0');
}
$('#salvar').onclick=()=>{
  const desc=$('#fDesc').value.trim(), valor=valorNum($('#fVal').value), venc=$('#fVenc').value;
  if(!desc||!(valor>0)||!venc){$('#erro').textContent='Preencha descrição, valor maior que zero e vencimento.';return}
  const base={tipo:tipoSel(),desc,valor,venc,cat:$('#fCat').value.trim(),obs:$('#fObs').value.trim(),pago:$('#fPago').checked};
  if(editando){Object.assign(editando,base,{pagoEm:base.pago?(editando.pagoEm||hoje()):null})}
  else{
    const n=Math.max(1,Math.min(60,parseInt($('#fRep').value)||1));
    for(let i=0;i<n;i++)db.push({...base,id:Date.now().toString(36)+i+Math.random().toString(36).slice(2,6),
      desc:n>1?`${desc} (${i+1}/${n})`:desc,venc:somaMes(venc,i),pago:i===0&&base.pago,pagoEm:i===0&&base.pago?hoje():null});
  }
  salvarDb();$('#dlg').close();mes=venc.slice(0,7);render();
};

/* Backup e sincronia */
const msg=t=>$('#cMsg').textContent=t;
function lerCfg(){const c={token:$('#cToken').value.trim(),gist:$('#gist').value.trim()};gravar(S,c);return c}
async function gh(path,c,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(!r.ok)throw new Error(r.status===401?'Token inválido ou sem permissão de gist.':'O GitHub respondeu com erro '+r.status+'.');
  return r.json();
}
$('#abrirCfg').onclick=()=>{const c=ler(S,{});$('#cToken').value=c.token||'';$('#gist').value=c.gist||'';msg('');$('#dlgCfg').showModal()};
$('#fechaCfg').onclick=()=>{lerCfg();$('#dlgCfg').close()};
$('#enviar').onclick=async()=>{
  const c=lerCfg();if(!c.token){msg('Cole o token do GitHub primeiro.');return}
  msg('Enviando…');
  try{
    const files={'gastos.json':{content:JSON.stringify(db)}};
    if(c.gist)await gh('/gists/'+c.gist,c,{method:'PATCH',body:JSON.stringify({files})});
    else{const g=await gh('/gists',c,{method:'POST',body:JSON.stringify({description:'Meus gastos',public:false,files})});c.gist=g.id;gravar(S,c);$('#gist').value=g.id}
    msg('Enviado. Para usar em outro aparelho, informe o mesmo token e o ID do Gist e toque em “Baixar da nuvem”.');
  }catch(e){msg(e.message)}
};
$('#baixar').onclick=async()=>{
  const c=lerCfg();if(!c.token||!c.gist){msg('Informe o token e o ID do Gist.');return}
  if(!confirm('Isso substitui os dados deste aparelho pelos da nuvem. Continuar?'))return;
  msg('Baixando…');
  try{
    const g=await gh('/gists/'+c.gist,c);const f=g.files['gastos.json'];
    const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;
    const novo=JSON.parse(txt);if(!Array.isArray(novo))throw new Error('Arquivo da nuvem em formato inesperado.');
    db=novo;salvarDb();render();msg('Dados baixados.');
  }catch(e){msg(e.message)}
};
$('#exportar').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download='gastos-'+hoje()+'.json';a.click();URL.revokeObjectURL(a.href);
};
$('#importar').onclick=()=>$('#arq').click();
$('#arq').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const novo=JSON.parse(await f.text());if(!Array.isArray(novo))throw 0;
    if(confirm('Isso substitui os dados deste aparelho. Continuar?')){db=novo;salvarDb();render();msg('Backup importado.')}
  }catch{msg('Arquivo inválido.')}
  e.target.value='';
};
render();
</script>
</body>
</html>
